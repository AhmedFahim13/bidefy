name: Crawl e-GP

on:
  schedule:
    - cron: "0 20 * * *"        # 02:00 Dhaka - tenders
    - cron: "0 8 * * *"         # 14:00 Dhaka - contracts
  workflow_dispatch:
    inputs:
      endpoint:
        description: tenders or contracts
        default: tenders
      mode:
        description: backfill or delta
        default: backfill
      budget_min:
        description: minutes before the run checkpoints and exits
        default: "300"

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      INPUT_ENDPOINT: ${{ github.event.inputs.endpoint }}
      INPUT_MODE: ${{ github.event.inputs.mode }}
      INPUT_BUDGET: ${{ github.event.inputs.budget_min }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Decide mode for scheduled runs
        id: mode
        run: |
          EP="$INPUT_ENDPOINT"
          if [ -z "$EP" ]; then
            if [ "$EVENT_SCHEDULE" = "0 8 * * *" ]; then
              EP=contracts
            else
              EP=tenders
            fi
          fi
          if [ "$EP" != "tenders" ] && [ "$EP" != "contracts" ]; then
            echo "invalid endpoint: $EP" >&2
            exit 1
          fi
          MODE="$INPUT_MODE"
          if [ -n "$MODE" ] && [ "$MODE" != "backfill" ] && [ "$MODE" != "delta" ]; then
            echo "invalid mode: $MODE" >&2
            exit 1
          fi
          if [ -z "$MODE" ]; then
            if [ -f "checkpoints/$EP.json" ] && EP="$EP" python3 -c "import json,os,sys;c=json.load(open('checkpoints/'+os.environ['EP']+'.json'));sys.exit(0 if c['total_pages'] and c['next_page']>c['total_pages'] else 1)"; then
              MODE=delta
            else
              MODE=backfill
            fi
          fi
          echo "endpoint=$EP" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Crawl
        run: uv run python -m bidefy.crawler.run --endpoint "${{ steps.mode.outputs.endpoint }}" --mode "${{ steps.mode.outputs.mode }}" --budget-min "${INPUT_BUDGET:-300}"
      - name: Compact
        env:
          EP: ${{ steps.mode.outputs.endpoint }}
        run: uv run python -m bidefy.crawler.store compact --endpoint "$EP"
      - name: Build clean tables
        run: uv run python -m bidefy.normalize.build
      - name: Train classifier and apply
        run: |
          uv run python -m bidefy.models.classifier train
          uv run python -m bidefy.normalize.build
          uv run python -m bidefy.models.award train
          uv run python -m bidefy.models.award apply
      - name: Commit data
        run: |
          git config user.name "bidefy-bot"
          git config user.email "bidefy-bot@users.noreply.github.com"
          git add data checkpoints review models
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: ${{ steps.mode.outputs.endpoint }} ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "giving up after 3 attempts"
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load D1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd worker && npm ci --no-audit --no-fund)
          uv run python -m bidefy.export.d1 --max-writes 40000
      - name: Commit load watermark
        continue-on-error: true
        run: |
          git add checkpoints
          if git diff --cached --quiet; then echo "no watermark change"; exit 0; fi
          git commit -m "data: d1 watermark $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
