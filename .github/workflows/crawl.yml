name: Crawl e-GP

on:
  schedule:
    - cron: "0 20 * * *"        # 02:00 Dhaka - tenders
    - cron: "0 8 * * *"         # 14:00 Dhaka - contracts
  workflow_dispatch:
    inputs:
      endpoint:
        description: tenders or contracts
        default: tenders
      mode:
        description: backfill or delta
        default: backfill
      budget_min:
        description: minutes before the run checkpoints and exits
        default: "240"

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # an invariant that breaks opens an issue; see the last two steps

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      INPUT_ENDPOINT: ${{ github.event.inputs.endpoint }}
      INPUT_MODE: ${{ github.event.inputs.mode }}
      INPUT_BUDGET: ${{ github.event.inputs.budget_min }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/metrics_stability.py reads the run-to-run spread of the published figures out of
          # the history of models/metrics.json. A shallow clone would show one run and report a
          # noise floor of zero, which is the flattering direction, so fetch enough history to
          # cover the fortnight it looks back over. Each run makes about two commits.
          fetch-depth: 120
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Decide mode for scheduled runs
        id: mode
        run: |
          EP="$INPUT_ENDPOINT"
          if [ -z "$EP" ]; then
            if [ "$EVENT_SCHEDULE" = "0 8 * * *" ]; then
              EP=contracts
            else
              EP=tenders
            fi
          fi
          if [ "$EP" != "tenders" ] && [ "$EP" != "contracts" ]; then
            echo "invalid endpoint: $EP" >&2
            exit 1
          fi
          MODE="$INPUT_MODE"
          if [ -n "$MODE" ] && [ "$MODE" != "backfill" ] && [ "$MODE" != "delta" ]; then
            echo "invalid mode: $MODE" >&2
            exit 1
          fi
          if [ -z "$MODE" ]; then
            if [ -f "checkpoints/$EP.json" ] && EP="$EP" python3 -c "import json,os,sys;c=json.load(open('checkpoints/'+os.environ['EP']+'.json'));sys.exit(0 if c.get('backfill_completed') or (c['total_pages'] and c['next_page']>c['total_pages']) else 1)"; then
              MODE=delta
            else
              MODE=backfill
            fi
          fi
          echo "endpoint=$EP" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Crawl
        run: uv run python -m bidefy.crawler.run --endpoint "${{ steps.mode.outputs.endpoint }}" --mode "${{ steps.mode.outputs.mode }}" --budget-min "${INPUT_BUDGET:-180}"
      - name: Fetch live tender details
        continue-on-error: true
        run: uv run python -m bidefy.crawler.details --source live --n 1500 --budget-min 20 --interval 1.0
      # Detail pages for tenders that have already been awarded are what teach the model the link
      # between the published security and the award value. Of the awards signed since the portal's
      # detail pages stop being served, only a low single-digit percentage have been fetched, and
      # about 85 percent of fetched pages publish a security. Each one turns a five-times-wide
      # history band into a one-and-a-half-times security band, and adds a genuine category label.
      # This is the highest-value crawling left, so it gets a budget of its own every night.
      - name: Fetch details for awarded tenders
        continue-on-error: true
        run: uv run python -m bidefy.crawler.details --source contracts --signed-since 2025-09-01 --n 4000 --budget-min 60 --interval 1.0
      - name: Compact
        env:
          EP: ${{ steps.mode.outputs.endpoint }}
        run: uv run python -m bidefy.crawler.store compact --endpoint "$EP"
      - name: Build clean tables
        run: uv run python -m bidefy.normalize.build
      - name: Train classifier and apply
        run: |
          uv run python -m bidefy.models.classifier train
          uv run python -m bidefy.normalize.build
          uv run python -m bidefy.models.award train
          uv run python -m bidefy.models.award apply
          uv run python tools/metrics_stability.py
          uv run python tools/write_accuracy_doc.py
      - name: Commit data
        id: commit
        run: |
          git config user.name "bidefy-bot"
          git config user.email "bidefy-bot@users.noreply.github.com"
          git add data checkpoints review models
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: ${{ steps.mode.outputs.endpoint }} ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          # Anything still unstaged here is checkout noise, never crawl output: the crawl's files
          # were just committed. Leaving it around makes the rebase below stash it and fail on a
          # conflict, which once threw away a four-hour crawl.
          git checkout -- . || true
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "giving up after 3 attempts"
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
      - name: Invariants
        id: invariants
        # After the commit, on purpose. Every incident on this project was a step that did the wrong
        # thing and exited zero, so these assertions exist to fail the job. Running them before the
        # commit would pay for that with the crawl, which is the worse trade. Running them here also
        # means a run nobody can vouch for never reaches D1, because a failed step skips the rest.
        run: uv run python tools/check_pipeline.py | tee "$RUNNER_TEMP/invariants.txt"
      - name: Raise an issue when an invariant breaks
        # A check that fails into a log nobody reads is not an alert. A failed workflow does send
        # mail, but it says only that something failed; an issue carries which invariant, what it
        # said, and a link to the run, and it stays open until somebody closes it. One issue is
        # reused so a week of broken nights is one thread rather than fourteen.
        if: failure() && steps.invariants.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/issue.md"
          {
            echo "A nightly run produced data that breaks an invariant. The crawl is committed and"
            echo "safe; the run that produced it is not trustworthy, and the D1 load was skipped."
            echo
            echo '```'
            cat "$RUNNER_TEMP/invariants.txt"
            echo '```'
            echo
            echo "$RUN_URL"
          } > "$report"
          existing=$(gh issue list --label nightly-invariant --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$report"
          else
            gh label create nightly-invariant --description "A nightly run broke a pipeline invariant" --color B60205 2>/dev/null || true
            gh issue create --title "Nightly invariants broken" --label nightly-invariant --body-file "$report"
          fi
      - name: Close the issue once the invariants hold again
        if: success() && steps.invariants.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Leaving a stale alert open is how people learn to ignore alerts.
          for n in $(gh issue list --label nightly-invariant --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The invariants held on $RUN_URL"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load D1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd worker && npm ci --no-audit --no-fund)
          uv run python -m bidefy.export.d1 --max-writes 80000 --max-per-run 40000
      - name: Commit load watermark
        continue-on-error: true
        run: |
          git add checkpoints
          if git diff --cached --quiet; then echo "no watermark change"; exit 0; fi
          git commit -m "data: d1 watermark $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
