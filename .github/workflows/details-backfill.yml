name: Details backfill

# Works through every tender in the index that still has no detail page, awarded first and newest
# first, so the whole archive gets a category label and a security amount. A probe of 198 pages
# from 2013-2023 (2026-11-03) found no stubs, a usable label on 90 percent and a security amount
# on 89 percent. At one request a second, two runs a day of 200 minutes take about four weeks for
# the 562k that were left, and the fetch stops on its own once nothing is left.
#
# It runs straight after each crawl, in the crawl's concurrency group, so the portal never sees
# two of our crawlers at once. Starting it from the crawl's completion rather than from its own
# schedule matters: GitHub keeps one pending run per group and a newly queued run cancels it, so
# a backfill queued on a timer could cancel a crawl that was waiting behind another backfill.
# Started this way, nothing can queue while a crawl is pending. Do not dispatch it by hand while
# a crawl is waiting. Training is left to the crawl, which retrains on every detail row it finds.
#
# Each run first reads the Annual Procurement Plan estimate for live tenders that have none yet
# (bidefy/crawler/plan.py), while they are still open, which is what makes the forward test in
# tools/plan_forward_test.py honest. That step is capped at 40 minutes; the archive gets the rest.

on:
  workflow_run:
    workflows: ["Crawl e-GP"]
    types: [completed]
  workflow_dispatch:
    inputs:
      budget_min:
        description: minutes of archive fetching before the run commits and exits
        default: "200"
      plan_budget_min:
        description: minutes for reading plan estimates of live tenders
        default: "40"

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BUDGET: ${{ github.event.inputs.budget_min || '200' }}
      PLAN_BUDGET: ${{ github.event.inputs.plan_budget_min || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Read plan estimates for live tenders
        continue-on-error: true
        run: uv run python -m bidefy.crawler.plan --budget-min "$PLAN_BUDGET" --interval 1.0
      - name: Fetch archived detail pages
        # a run cut short still commits what it fetched; the next run carries on from there
        continue-on-error: true
        run: uv run python -m bidefy.crawler.details --source archive --n 20000 --budget-min "$BUDGET" --interval 1.0
      - name: Compact
        run: |
          uv run python -m bidefy.crawler.store compact --endpoint details
          uv run python -m bidefy.crawler.store compact --endpoint plan_estimates
      - name: Commit data
        run: |
          git config user.name "bidefy-bot"
          git config user.email "bidefy-bot@users.noreply.github.com"
          # add only what exists: a step that crashed before writing must not sink the other's work
          for p in data/raw/details data/raw/plan_estimates checkpoints/details_archive.json checkpoints/plan_estimates.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: details archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git checkout -- . || true
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "giving up after 3 attempts"
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
