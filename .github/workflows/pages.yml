name: Command centre

on:
  push:
    branches: [main]
    paths:
      - status.yaml
      - checkpoints/**
      - models/metrics.json
      - docs/product/**
      - tools/build_site.py
      - .github/workflows/pages.yml
  # The crawler commits with GITHUB_TOKEN, and GitHub starts no workflow from
  # a GITHUB_TOKEN push, so the push trigger above never saw its commits and
  # the page froze at 2026-09-27. Rebuild after every crawl instead.
  workflow_run:
    workflows: ["Crawl e-GP"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
