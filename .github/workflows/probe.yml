name: e-GP one-page probe

on:
  workflow_dispatch:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show runner egress IP
        run: curl -s https://api.ipify.org || true
      - name: Fetch one page from each endpoint
        run: python probe/fetch_one_page.py
