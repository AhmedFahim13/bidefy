project: Bidefy
tagline: Tender intelligence for Bangladesh's e-GP portal
launch_target: 2026-10-11
phases:
  - id: w1
    name: "Week 1: crawler and index"
    tasks:
      - {id: w1-scaffold, title: "Package scaffold, pytest, CI", owner: claude, state: done, weight: 1}
      - {id: w1-fixtures, title: "HTML fixtures from the portal", owner: claude, state: done, weight: 1}
      - {id: w1-parse, title: "Parsers for tender, contract and detail pages", owner: claude, state: done, weight: 3}
      - {id: w1-checkpoint, title: "Checkpoint and Parquet store", owner: claude, state: done, weight: 2}
      - {id: w1-session, title: "Session, rate limiter, crawl policy", owner: claude, state: done, weight: 3}
      - {id: w1-workflow, title: "Nightly crawl workflow", owner: claude, state: done, weight: 2}
      - {id: w1-backfill, title: "Full tender index backfilled", owner: claude, state: done, weight: 3, note: "All 3,131 pages crawled, 625,365 notices; finished on the nightly job 2026-09-15"}
      - {id: w1-centre, title: "Command centre on GitHub Pages", owner: claude, state: done, weight: 2}
      - {id: w1-cloudflare, title: "Create Cloudflare account and run wrangler login", owner: fahim, state: done, weight: 1}
      - {id: w1-terms, title: "Read e-GP terms and disclaimer pages once", owner: fahim, state: done, weight: 1}
  - id: w2
    name: "Week 2: contracts, entity resolution, D1, Worker skeleton"
    tasks:
      - {id: w2-contracts, title: "Contracts index backfilled", owner: claude, state: done, weight: 3, note: "All 4,389 pages crawled; 682,612 usable awards"}
      - {id: w2-resolve, title: "Entity resolution with review queue", owner: claude, state: done, weight: 4}
      - {id: w2-d1, title: "D1 schema and nightly load within write limits", owner: claude, state: done, weight: 3}
      - {id: w2-worker, title: "Worker skeleton with Hono", owner: claude, state: done, weight: 2}
      - {id: w2-api-live, title: "Worker API live on workers.dev", owner: claude, state: done, weight: 1, note: "https://bidefy.iba-jobs.workers.dev/api/v1/health"}
      - {id: w2-review, title: "Review the borderline name pairs", owner: fahim, state: done, weight: 1, note: "Decided by rule in tools/adjudicate_pairs.py: 1,645 merges, 54,423 kept apart. The 14,127 genuinely ambiguous pairs stay queued"}
      - {id: w2-domain, title: "Stay on workers.dev", owner: fahim, state: done, weight: 1}
      - {id: w2-token, title: "Create a Cloudflare API token with D1 edit rights and add it as the CLOUDFLARE_API_TOKEN repo secret", owner: fahim, state: done, weight: 2}
  - id: w3
    name: "Week 3: site pages, PWA, push"
    tasks:
      - {id: w3-pages, title: "Live tenders, tender, bidder, entity and alerts pages", owner: claude, state: done, weight: 4}
      - {id: w3-pwa, title: "PWA manifest, service worker, push subscriptions", owner: claude, state: done, weight: 3}
      - {id: w3-vercel, title: "Site live on Vercel", owner: claude, state: done, weight: 1, note: "https://bidefy.vercel.app"}
  - id: w4
    name: "Week 4: classifier, alert cron, public launch"
    tasks:
      - {id: w4-sample, title: "Detail-page sample for training labels", owner: claude, state: done, weight: 1}
      - {id: w4-classifier, title: "Category classifier with metrics and deferral", owner: claude, state: done, weight: 3, note: "0.906 acted accuracy at 0.158 deferral"}
      - {id: w4-cron, title: "Hourly alert matcher and push sender", owner: claude, state: done, weight: 3, note: "Admin dry-run endpoint verified; bootstrap rule prevents backlog spam"}
      - {id: w4-launch, title: "Public launch v0.1", owner: claude, state: done, weight: 2, note: "Tagged v0.1.0"}
      - {id: w4-post, title: "Write and publish the launch post", owner: fahim, state: todo, weight: 1, note: "Draft written at docs/launch-post.md; posting needs his own account"}
  - id: w5
    name: "Week 5: award-value model"
    tasks:
      - {id: w5-model, title: "LightGBM award model with interval and baseline", owner: claude, state: done, weight: 4, note: "Median APE 0.49 vs 0.57 baseline, 80% band coverage 0.79, deferral 0.25"}
      - {id: w5-personas, title: "Five data-derived buyer profiles from the awards table, labelled as such", owner: claude, state: done, weight: 2}
      - {id: w5-signals, title: "Request-access form live and collecting real pricing signals", owner: claude, state: done, weight: 2, note: "bidefy.vercel.app/access"}
  - id: w6
    name: "Week 6: anomaly flags and profiles"
    tasks:
      - {id: w6-flags, title: "Winner concentration and residual flags", owner: claude, state: done, weight: 3, note: "606 entities and 3,366 bidders carry notes"}
      - {id: w6-profiles, title: "Bidder and procuring entity profile pages", owner: claude, state: done, weight: 3}
      - {id: w6-proxy, title: "Browser calls proxied through the site origin (workers.dev is blocked on some ISPs)", owner: claude, state: done, weight: 2}
      - {id: w6-learn, title: "Procurement primer, glossary, tooltips and Learn page", owner: claude, state: done, weight: 2}
      - {id: w6-paging, title: "Page jump and page size on the tender list", owner: claude, state: done, weight: 1}
      - {id: w6-login, title: "Run npx wrangler login again in your terminal", owner: fahim, state: done, weight: 1, note: "Verified: logged in as ahmed.fahim.official.bd@gmail.com"}
      - {id: w6-token, title: "Cloudflare API token extended to Workers Scripts: Edit; Deploy Worker workflow green", owner: fahim, state: done, weight: 2}
      - {id: w6-primer, title: "Read docs/product/04-primer.md before any interview", owner: fahim, state: todo, weight: 1, note: "Also live at bidefy.vercel.app/learn"}
  - id: w7
    name: "Week 7: product document, pricing, polish"
    tasks:
      - {id: w7-doc, title: "Full product document", owner: claude, state: done, weight: 3, note: "Ten sections at /doc.html: overview, market, system, buyers, primer, accuracy, experiments, operations, decisions, roadmap and risks"}
      - {id: w7-pricing, title: "Pricing page with request-access form", owner: claude, state: todo, weight: 2}
      - {id: w7-polish, title: "Polish, stale banner, dashboard final", owner: claude, state: done, weight: 2, note: "Dashboard shows headline model figures rather than every key; live links added; stale banner trips at 36 hours"}
  - id: w8
    name: "Week 8: usage, demo, outreach"
    tasks:
      - {id: w8-usage, title: "Usage numbers collected and shown", owner: claude, state: todo, weight: 2}
      - {id: w8-demo, title: "Record two-minute demo video", owner: fahim, state: todo, weight: 2}
      - {id: w8-outreach, title: "Message the four Advanced AI Lab product managers", owner: fahim, state: todo, weight: 3}
      - {id: w8-bkash, title: "bKash merchant account for the Pro tier (later)", owner: fahim, state: todo, weight: 1}
